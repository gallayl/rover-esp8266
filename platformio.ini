; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
board_build.f_cpu = 160000000L
build_unflags = -std=gnu++11 -std=gnu++14
build_flags =
	-std=gnu++17
	-Wall
	-Wextra
	-Wpedantic
	-Werror=return-type
	-Werror=implicit-fallthrough
build_src_flags =
	-Wshadow
	-Wnon-virtual-dtor
extra_scripts =
	pre:scripts/inject_version.py
	pre:scripts/build_frontend.py
check_tool = cppcheck
check_src_filters =
	+<src/>
check_severity = medium, high
check_flags =
	cppcheck: --suppress=missingIncludeSystem --suppress=unusedFunction --inline-suppr
check_skip_packages = yes
lib_deps = 
	ESP32Async/ESPAsyncWebServer@^3.8.1
	alanswx/ESPAsyncWiFiManager@^0.31
	SimpleTimer
	dlloydev/QuickPID@^3.1.9
	teckel12/NewPing@^1.9.1
	./lib/ESP8266FtpServer

[env:native]
platform = native
test_framework = unity
build_unflags = -std=gnu++11 -std=gnu++14
build_flags =
	-std=gnu++17
	-Wall
	-Wextra
	-Wpedantic
build_src_filter = -<*>
test_filter = test_parser_core
