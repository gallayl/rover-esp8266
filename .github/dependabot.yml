version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      js-minor:
        patterns: ["*"]
        update-types: [minor, patch]
      js-major:
        patterns: ["*"]
        update-types: [major]

  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python-tooling:
        patterns: ["*"]
