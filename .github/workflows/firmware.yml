name: Firmware

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "lib/**"
      - "test/**"
      - "scripts/**"
      - "platformio.ini"
      - ".clang-format"
      - ".clang-tidy"
      - ".clangd"
      - ".github/workflows/firmware.yml"
  pull_request:
    branches: [master]
    paths:
      - "src/**"
      - "lib/**"
      - "test/**"
      - "scripts/**"
      - "platformio.ini"
      - ".clang-format"
      - ".clang-tidy"
      - ".clangd"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: platformio-

      - run: uv tool install 'platformio>=6.1,<7'

      - run: pio run

  test-native:
    name: Native tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: platformio-

      - run: uv tool install 'platformio>=6.1,<7'

      - run: pio test -e native

  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Check formatting
        run: |
          mapfile -t FILES < <(find src test -type f \( -name '*.cpp' -o -name '*.cc' -o -name '*.c' -o -name '*.h' -o -name '*.hpp' \) 2>/dev/null)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No files to check"; exit 0
          fi
          uvx --from 'clang-format==18.1.8' clang-format --dry-run --Werror "${FILES[@]}"

  cppcheck:
    name: cppcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: platformio-

      - run: uv tool install 'platformio>=6.1,<7'

      - name: Run pio check (cppcheck)
        run: pio check --fail-on-defect=high --skip-packages

  clang-tidy:
    name: clang-tidy (warn-only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: platformio-

      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy-18

      - run: uv tool install 'platformio>=6.1,<7'

      - name: Generate compile_commands.json
        run: pio run -t compiledb

      - name: Run clang-tidy on src/
        run: |
          mapfile -t SRC < <(find src -type f \( -name '*.cpp' -o -name '*.cc' -o -name '*.c' \))
          if [ ${#SRC[@]} -eq 0 ]; then
            echo "No sources to lint"; exit 0
          fi
          clang-tidy-18 -p . "${SRC[@]}" || true
