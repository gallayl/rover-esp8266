name: Firmware

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "lib/**"
      - "test/**"
      - "scripts/**"
      - "platformio.ini"
      - ".clang-format"
      - ".clang-tidy"
      - ".clangd"
      - "package.json"
      - "yarn.lock"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/actions/setup/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    branches: [master]
    paths:
      - "src/**"
      - "lib/**"
      - "test/**"
      - "scripts/**"
      - "platformio.ini"
      - ".clang-format"
      - ".clang-tidy"
      - ".clangd"
      - "package.json"
      - "yarn.lock"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/actions/setup/**"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: yarn build:firmware

  test-native:
    name: Native tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: yarn test:native

  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: yarn format:cpp:check

  cppcheck:
    name: cppcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: yarn lint:cpp

  clang-tidy:
    name: clang-tidy (warn-only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: yarn lint:cpp:tidy
