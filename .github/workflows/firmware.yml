name: Firmware

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "lib/**"
      - "data/**"
      - "platformio.ini"
      - ".github/workflows/firmware.yml"
  pull_request:
    branches: [master]
    paths:
      - "src/**"
      - "lib/**"
      - "data/**"
      - "platformio.ini"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: platformio-

      - run: pip install platformio

      - run: pio run
