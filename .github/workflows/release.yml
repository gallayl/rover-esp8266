name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to label the release artifacts (does not create a tag)"
        required: false
        default: "manual"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build firmware + LittleFS image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # tags + history needed for `git describe` in inject_version.py

      - uses: ./.github/actions/setup

      - name: Build firmware
        run: yarn build:firmware

      - name: Build LittleFS image (frontend bundled in)
        run: yarn build:fs

      - name: Stage artifacts
        run: |
          mkdir -p release
          cp .pio/build/nodemcuv2/firmware.bin release/firmware.bin
          cp .pio/build/nodemcuv2/littlefs.bin release/littlefs.bin
          ls -la release/

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.event.inputs.tag }}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rover-${{ steps.tag.outputs.name }}
          path: release/

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/firmware.bin
            release/littlefs.bin
          generate_release_notes: true
